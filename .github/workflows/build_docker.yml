name: Build CHR Docker

on:
  schedule:
    - cron: "00 10 * * *"   # At UTC 09:00 (Beijing 17:00) on every day

  push:
    branches:
      - main
    paths:
      - '.github/workflows/build_docker.yml'

  workflow_dispatch:
    inputs:
      version:
        description: "Specify version (e.g., 7.19.2), empty for latest"
        required: false
        default: ''
        type: string
      force:
        description: "Force rebuild even if version already exists"
        required: false
        default: true
        type: boolean

permissions:
  packages: write
jobs:
  Prepare:
    runs-on: ubuntu-24.04
    outputs:
      MATRIX: ${{ steps.filter_matrix.outputs.MATRIX }}
    steps:
      - name: Get versions and generate matrix
        id: get_versions
        run: |
          VERSION="${{ inputs.version }}"
          if [ -n "$VERSION" ]; then
            MATRIX=$(jq -c -n '
              [
                { "version": $VERSION, "channel": ""}
              ]
            ' --arg VERSION "$VERSION")
          else
            TIMESTAMP=$(date +%s)
            LONG_TERM=$(wget -nv -O - "https://upgrade.mikrotik.ltd/routeros/NEWESTa7.long-term?t=$TIMESTAMP" | cut -d ' ' -f1)
            STABLE=$(wget -nv -O - "https://upgrade.mikrotik.ltd/routeros/NEWESTa7.stable?t=$TIMESTAMP" | cut -d ' ' -f1)

            echo "Long-term version: $LONG_TERM"
            echo "Stable version: $STABLE"
            if [ -z "$LONG_TERM" ]; then
              echo "Failed to get long-term version"
              exit 1
            fi
            if [ -z "$STABLE" ]; then
              echo "Failed to get stable version"
              exit 1
            fi
            MATRIX=$(jq -c -n '
              [
                {version: $LONG_TERM, channel: "long-term"},
                {version: $STABLE, channel: "stable"}
              ]
            ' --arg LONG_TERM "$LONG_TERM" --arg STABLE "$STABLE")
          fi
          echo "Generated matrix: $MATRIX"
          echo "MATRIX=$MATRIX" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Filter already-published versions from matrix
        id: filter_matrix
        env:
          IMAGE: "ghcr.io/${{ github.repository_owner }}/chr"
          FORCE: ${{ github.event.inputs.force == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force != 'false') || github.event_name == 'push' }}
        run: |
          MATRIX='${{ steps.get_versions.outputs.MATRIX }}'
          if [ "$FORCE" = "true" ]; then
            echo "Force mode enabled, skipping version existence check."
            FILTERED="$MATRIX"
          else
            FILTERED='[]'
            while read -r row; do
              VERSION=$(echo "$row" | jq -r '.version')
              CHANNEL=$(echo "$row" | jq -r '.channel')

              set +e
              docker manifest inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1
              RET=$?
              set -e

              if [ "$RET" -eq 0 ]; then
                echo "Skipping already published version: ${VERSION}"
              else
                FILTERED=$(echo "$FILTERED" | jq -c --arg VERSION "$VERSION" --arg CHANNEL "$CHANNEL" '. + [{"version": $VERSION, "channel": $CHANNEL}]')
              fi
            done < <(echo "$MATRIX" | jq -c '.[]')
          fi

          echo "Filtered matrix: $FILTERED"
          echo "MATRIX=$FILTERED" >> "$GITHUB_OUTPUT"

  Build:
    if: needs.Prepare.outputs.MATRIX != '[]'
    runs-on: ubuntu-24.04
    needs: Prepare
    strategy:
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.Prepare.outputs.MATRIX != '[]' && needs.Prepare.outputs.MATRIX || '[{"version":"__NO_BUILD__","channel":""}]') }}
    env:
      TZ: 'Asia/Shanghai'
      VERSION: ${{ matrix.version }}
      CHANNEL: ${{ matrix.channel }}
      IMAGE: "ghcr.io/${{ github.repository_owner }}/chr"
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'

    steps:
      - name: Show build info
        run: |
          echo "Version: ${{ env.VERSION }}"
          echo "Channel: ${{ env.CHANNEL }}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download CHR image
        run: |
          # x86 架构
          mkdir -p "amd64"
          wget -nv -O "amd64/chr-$VERSION.img.zip" \
            "https://github.com/elseif/MikroTikPatch/releases/download/$VERSION/chr-$VERSION-legacy-bios.img.zip"
          unzip "amd64/chr-$VERSION.img.zip" -d "amd64/"
          mv "amd64/chr-$VERSION-legacy-bios.img" "amd64/chr.img"
          rm "amd64/chr-$VERSION.img.zip"

          # arm64 架构
          mkdir -p "arm64"
          wget -nv -O "arm64/chr-$VERSION-arm64.img.zip" \
            "https://github.com/elseif/MikroTikPatch/releases/download/$VERSION-arm64/chr-$VERSION-arm64.img.zip"
          unzip "arm64/chr-$VERSION-arm64.img.zip" -d "arm64/"
          mv "arm64/chr-$VERSION-arm64.img" "arm64/chr.img"
          rm "arm64/chr-$VERSION-arm64.img.zip"
          
          ls -la amd64/ arm64/
          
      - name: Create start.sh
        run: |
          cat <<'EOF' > start.sh
          #!/bin/sh
          set -e

          # Ensure /dev/net/tun is available
          mkdir -p /dev/net
          if [ ! -c /dev/net/tun ]; then
              mknod /dev/net/tun c 10 200 || true
              chmod 666 /dev/net/tun || true
          fi
          sysctl -w net.ipv4.ip_forward=1 2>/dev/null || true
          sysctl -w net.ipv4.ip_nonlocal_bind=1 2>/dev/null || true

          MEM="${MEM:=512m}"
          DISK="${DISK:=128M}"
          CPUS="${CPUS:=1}"
          bridge_index=0

          get_mac_address() {
              ifname="$1"
              ip link show "$ifname" 2>/dev/null | awk '/link\/ether/ {print $2}'
          }

          increment_mac() {
              mac=$1
              mac_no_colons=$(echo "$mac" | tr -d ':' | tr '[:lower:]' '[:upper:]')
              mac_dec=$((16#${mac_no_colons}))
              mac_dec=$((mac_dec + 1))
              mac_hex=$(printf "%012X" "$mac_dec")
              echo "$mac_hex" | sed 's/.\{2\}/&:/g;s/:$//'
          }

          cidr2mask() {
              local cdr=${1:-24}
              local mask=""
              local i
              for i in 1 2 3 4; do
                  if [ "$cdr" -ge 8 ]; then
                      mask="${mask}255"
                      cdr=$((cdr - 8))
                  elif [ "$cdr" -gt 0 ]; then
                      mask="${mask}$((256 - (1 << (8 - cdr))))"
                      cdr=0
                  else
                      mask="${mask}0"
                  fi
                  [ "$i" -lt 4 ] && mask="${mask}."
              done
              echo "$mask"
          }

          echo "" > /etc/qemu/bridge.conf

          qemu="qemu-system-x86_64"
          if [[ `uname -m` == "aarch64" ]]; then
             qemu="qemu-system-aarch64 -pflash /usr/share/qemu/edk2-aarch64-code.fd -M virt"
          fi

          if [ -e /dev/kvm ]; then
              qemu="$qemu -enable-kvm -cpu host"
          else
              if [[ `uname -m` == "aarch64" ]]; then
                  qemu="$qemu -cpu cortex-a57"
              fi
          fi

          orig_img=`ls /diskimage/*.img 2>/dev/null | head -n 1`
          if [ -d "/routeros" ]; then
              img="/routeros/chr.img"
              if [ ! -f "$img" ]; then
                  echo "Initializing persistent disk from base image..."
                  cp "$orig_img" "$img"
              fi
          else
              img="$orig_img"
          fi
          truncate -s $DISK $img || true

          qemu="$qemu -nographic -m $MEM -smp cpus=$CPUS -drive file=$img,format=raw"

          all_ifaces=""
          for dev_path in /sys/class/net/*; do
              dev=$(basename "$dev_path")
              case "$dev" in
                  lo|br*|tun*|tap*|docker*|veth*) continue ;;
                  *) all_ifaces="$all_ifaces $dev" ;;
              esac
          done

          # 1. Determine primary WAN interface (br0 -> ether1)
          # Priority: WAN_IFACE -> WAN_SUBNET -> macvlan/ipvlan -> 192.168.* -> default gateway -> first interface
          wan_iface=""
          for dev in $all_ifaces; do
              dev_ip=$(ip -4 addr show dev "$dev" 2>/dev/null | awk '/inet / {print $2}' | cut -d'/' -f1)
              if [ -n "$WAN_IFACE" ] && [ "$dev" = "$WAN_IFACE" ]; then
                  wan_iface="$dev"
                  break
              fi
              if [ -n "$WAN_SUBNET" ] && echo "$dev_ip" | grep -q "$WAN_SUBNET"; then
                  wan_iface="$dev"
                  break
              fi
              if ip -d link show "$dev" 2>/dev/null | grep -qE "macvlan|ipvlan"; then
                  wan_iface="$dev"
                  break
              fi
              if echo "$dev_ip" | grep -q "^192\.168\."; then
                  wan_iface="$dev"
                  break
              fi
          done

          if [ -z "$wan_iface" ]; then
              for dev in $all_ifaces; do
                  if ip route show default dev "$dev" 2>/dev/null | grep -q "default"; then
                      wan_iface="$dev"
                      break
                  fi
              done
          fi

          if [ -z "$wan_iface" ]; then
              wan_iface=$(echo $all_ifaces | awk '{print $1}')
          fi

          # 2. Determine secondary LAN interface (br1 -> ether2)
          # Priority: LAN_IFACE -> LAN_SUBNET -> 172.* private subnet
          lan_iface=""
          remaining_ifaces=""
          for dev in $all_ifaces; do
              [ "$dev" = "$wan_iface" ] && continue
              dev_ip=$(ip -4 addr show dev "$dev" 2>/dev/null | awk '/inet / {print $2}' | cut -d'/' -f1)
              if [ -z "$lan_iface" ]; then
                  if [ -n "$LAN_IFACE" ] && [ "$dev" = "$LAN_IFACE" ]; then
                      lan_iface="$dev"
                      continue
                  fi
                  if [ -n "$LAN_SUBNET" ] && echo "$dev_ip" | grep -q "$LAN_SUBNET"; then
                      lan_iface="$dev"
                      continue
                  fi
                  if echo "$dev_ip" | grep -q "^172\."; then
                      lan_iface="$dev"
                      continue
                  fi
              fi
              remaining_ifaces="$remaining_ifaces $dev"
          done

          if [ -z "$lan_iface" ] && [ -n "$remaining_ifaces" ]; then
              lan_iface=$(echo $remaining_ifaces | awk '{print $1}')
              remaining_ifaces=$(echo $remaining_ifaces | sed "s/\b$lan_iface\b//")
          fi

          sorted_ifaces="$wan_iface $lan_iface $remaining_ifaces"

          sysctl -w net.ipv4.ip_forward=1 2>/dev/null || true
          sysctl -w net.ipv4.conf.all.rp_filter=0 2>/dev/null || true
          sysctl -w net.ipv4.conf.default.rp_filter=0 2>/dev/null || true
          iptables -t nat -F 2>/dev/null || true
          iptables -F FORWARD 2>/dev/null || true
          iptables -P FORWARD ACCEPT 2>/dev/null || true

          if [ ! -c /dev/net/tun ]; then
              mkdir -p /dev/net
              mknod /dev/net/tun c 10 200 2>/dev/null || true
          fi

          for iface in $sorted_ifaces; do
              [ -z "$iface" ] && continue
              echo "Configuring interface: $iface (target: ether$((bridge_index + 1)))"

              veth_mac=$(get_mac_address "$iface")
              mac_file="/routeros/mac_ether$((bridge_index + 1))"
              if [ -d "/routeros" ] && [ -s "$mac_file" ]; then
                  saved_mac=$(cat "$mac_file" | tr -d '\r\n ' | head -n 1)
                  echo "Found persistent MAC for ether$((bridge_index + 1)): $saved_mac"
                  ip link set dev "$iface" down 2>/dev/null || true
                  if ip link set dev "$iface" address "$saved_mac" 2>/dev/null; then
                      echo "Successfully restored MAC $saved_mac to $iface"
                      tap_mac="$saved_mac"
                  else
                      echo "Could not change MAC of $iface, using current: $veth_mac"
                      tap_mac="$veth_mac"
                      echo "$tap_mac" > "$mac_file"
                  fi
                  ip link set dev "$iface" up 2>/dev/null || true
              else
                  tap_mac="$veth_mac"
                  if [ -d "/routeros" ]; then
                      echo "$tap_mac" > "$mac_file"
                      echo "Saved persistent MAC for ether$((bridge_index + 1)): $tap_mac"
                  fi
              fi

              iface_ip=$(ip -4 addr show dev "$iface" 2>/dev/null | awk '/inet / {print $2}' | head -n 1)
              iface_gw=$(ip route show default dev "$iface" 2>/dev/null | awk '/default/ {print $3}' | head -n 1)

              if [ -z "$iface_gw" ] && [ "$bridge_index" -eq 0 ]; then
                  if [ -n "$GATEWAY" ]; then
                      iface_gw="$GATEWAY"
                  elif [ -n "$iface_ip" ]; then
                      ip_prefix=$(echo "$iface_ip" | cut -d'/' -f1 | sed 's/\.[0-9]*$//')
                      iface_gw="${ip_prefix}.1"
                  fi
              fi

              ip_no_mask=""
              ip_mask=""
              if [ -n "$iface_ip" ]; then
                  ip_no_mask=$(echo "$iface_ip" | cut -d'/' -f1)
                  ip_cidr=$(echo "$iface_ip" | cut -s -d'/' -f2)
                  [ -z "$ip_cidr" ] && ip_cidr=24
                  ip_mask=$(cidr2mask "$ip_cidr")
              fi

              tap="tap$bridge_index"
              can_use_tc=false

              if ip tuntap add dev "$tap" mode tap 2>/dev/null; then
                  ip link set dev "$tap" address "$tap_mac" up 2>/dev/null || true
                  ip link set dev "$iface" promisc on 2>/dev/null || true
                  tc qdisc del dev "$iface" ingress 2>/dev/null || true
                  tc qdisc del dev "$tap" ingress 2>/dev/null || true

                  if tc qdisc add dev "$iface" ingress 2>/dev/null && \
                     (tc filter add dev "$iface" ingress protocol all matchall action mirred egress redirect dev "$tap" 2>/dev/null || \
                      tc filter add dev "$iface" ingress protocol all u32 match u32 0 0 action mirred egress redirect dev "$tap" 2>/dev/null) && \
                     tc qdisc add dev "$tap" ingress 2>/dev/null && \
                     (tc filter add dev "$tap" ingress protocol all matchall action mirred egress redirect dev "$iface" 2>/dev/null || \
                      tc filter add dev "$tap" ingress protocol all u32 match u32 0 0 action mirred egress redirect dev "$iface" 2>/dev/null); then
                      can_use_tc=true
                      echo "Direct L2 mode (TC mirred) enabled for $iface <-> $tap (MAC: $tap_mac)"
                  fi
              fi

              if [ "$can_use_tc" = "true" ]; then
                  if [ -n "$ip_no_mask" ]; then
                      ip addr flush dev "$iface"

                      udhcpd_conf="/tmp/udhcpd_${tap}.conf"
                      udhcpd_leases="/tmp/udhcpd_${tap}.leases"
                      touch "$udhcpd_leases"

                      echo "start $ip_no_mask" > "$udhcpd_conf"
                      echo "end $ip_no_mask" >> "$udhcpd_conf"
                      echo "interface $tap" >> "$udhcpd_conf"
                      echo "max_leases 1" >> "$udhcpd_conf"
                      echo "lease_file $udhcpd_leases" >> "$udhcpd_conf"
                      echo "opt subnet $ip_mask" >> "$udhcpd_conf"
                      if [ "$bridge_index" -eq 0 ] && [ -n "$iface_gw" ]; then
                          echo "opt router $iface_gw" >> "$udhcpd_conf"
                          echo "opt dns 8.8.8.8 1.1.1.1" >> "$udhcpd_conf"
                      fi
                      echo "static_lease $tap_mac $ip_no_mask" >> "$udhcpd_conf"

                      server_ip="${iface_gw:-${ip_prefix}.1}"
                      echo "Starting udhcpd on $tap (MikroTik IP: $ip_no_mask, GW: ${iface_gw:-none}, Server-ID: $server_ip)..."
                      udhcpd -I "$server_ip" -f "$udhcpd_conf" &
                  fi

                  qemu="$qemu -netdev tap,id=$tap,ifname=$tap,script=no,downscript=no -device virtio-net,netdev=$tap,mac=$tap_mac "
              else
                  echo "TC mirred failed or unavailable, falling back to internal bridge + DNAT for $iface"
                  ip link delete "$tap" 2>/dev/null || true

                  bridge="br$bridge_index"
                  ip link add name "$bridge" type bridge
                  internal_net="10.199.$((bridge_index + 1))"
                  bridge_ip="${internal_net}.1"
                  mikrotik_ip="${internal_net}.2"

                  ip addr add "${bridge_ip}/30" dev "$bridge"
                  ip link set dev "$bridge" up
                  echo "allow $bridge" >> /etc/qemu/bridge.conf

                  if [ -z "$iface_gw" ] && [ "$bridge" = "br0" ]; then
                      if [ -n "$iface_gw" ]; then
                          ip route replace default via "$iface_gw" dev "$iface" 2>/dev/null || true
                      fi
                  fi

                  if [ -n "$iface_ip" ]; then
                      udhcpd_conf="/tmp/udhcpd_${bridge}.conf"
                      udhcpd_leases="/tmp/udhcpd_${bridge}.leases"
                      touch "$udhcpd_leases"

                      echo "start $mikrotik_ip" > "$udhcpd_conf"
                      echo "end $mikrotik_ip" >> "$udhcpd_conf"
                      echo "interface $bridge" >> "$udhcpd_conf"
                      echo "max_leases 1" >> "$udhcpd_conf"
                      echo "lease_file $udhcpd_leases" >> "$udhcpd_conf"
                      echo "opt subnet 255.255.255.252" >> "$udhcpd_conf"
                      if [ "$bridge" = "br0" ]; then
                          echo "opt router $bridge_ip" >> "$udhcpd_conf"
                          echo "opt dns 8.8.8.8 1.1.1.1" >> "$udhcpd_conf"
                      fi
                      echo "static_lease $tap_mac $mikrotik_ip" >> "$udhcpd_conf"

                      echo "Starting udhcpd on $bridge (MikroTik IP: $mikrotik_ip, GW: $bridge_ip)..."
                      udhcpd -I "$bridge_ip" -f "$udhcpd_conf" &

                      echo "Configuring forwarding: $ip_no_mask ($iface) <-> $mikrotik_ip ($bridge)..."
                      iptables -t nat -A PREROUTING -d "$ip_no_mask" -j DNAT --to-destination "$mikrotik_ip"
                      iptables -t nat -A OUTPUT -d "$ip_no_mask" -j DNAT --to-destination "$mikrotik_ip"
                      iptables -t nat -A POSTROUTING -o "$iface" -j MASQUERADE
                      iptables -t nat -A POSTROUTING -o "$bridge" -j MASQUERADE
                  fi

                  qemu="$qemu -netdev bridge,id=$bridge,br=$bridge -device virtio-net,netdev=$bridge,mac=$tap_mac "
              fi

              bridge_index=$((bridge_index + 1))
          done

          echo "qemu: $qemu"
          exec $qemu
          EOF
          chmod +x start.sh

      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM alpine:latest
          ARG TARGETARCH
          ARG VERSION
          RUN case "$TARGETARCH" in \
                amd64) apk add --no-cache qemu-system-x86_64 ;; \
                arm64) apk add --no-cache qemu-system-aarch64 ;; \
              esac \
              && apk add --no-cache busybox-extras dnsmasq iptables iproute2 iproute2-tc socat \
              && rm -rf /var/cache/apk/*
          RUN mkdir -p /diskimage /routeros
          COPY ${TARGETARCH}/*.img /diskimage/
          COPY start.sh /start.sh
          ENTRYPOINT ["/start.sh"]
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
          
      - name: Build and Push 
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
          outputs: >
            type=image,
            annotation-index.org.opencontainers.image.title=MikroTik CHR RouterOS,
            annotation-index.org.opencontainers.image.description=MikroTik CHR (Cloud Hosted Router) running on QEMU with Docker,
            annotation-index.org.opencontainers.image.version=${{ env.VERSION }},
            annotation-index.org.opencontainers.image.url=https://mikrotik.ltd

      - name: Update channel tags
        if: env.CHANNEL != ''
        run: |
          TAGS="-t ${{ env.IMAGE }}:${{ env.CHANNEL }}"
          if [ "${{ env.CHANNEL }}" = "stable" ]; then
            TAGS="$TAGS -t ${{ env.IMAGE }}:latest"
          fi
          echo "Creating tags: $TAGS"
          docker buildx imagetools create $TAGS ${{ env.IMAGE }}:${{ env.VERSION }}

      - name: Save Docker Image as tar
        run: |
          mkdir -p artifacts
          echo "Exporting amd64 tar..."
          docker pull --platform linux/amd64 ${{ env.IMAGE }}:${{ env.VERSION }}
          docker save ${{ env.IMAGE }}:${{ env.VERSION }} -o artifacts/chr-${{ env.VERSION }}-amd64.tar
          echo "Exporting arm64 tar..."
          docker pull --platform linux/arm64 ${{ env.IMAGE }}:${{ env.VERSION }}
          docker save ${{ env.IMAGE }}:${{ env.VERSION }} -o artifacts/chr-${{ env.VERSION }}-arm64.tar
          ls -lh artifacts/

      - name: Upload tar artifact
        uses: actions/upload-artifact@v7
        with:
          name: chr-${{ env.VERSION }}-docker-images
          path: artifacts/
          retention-days: 30
